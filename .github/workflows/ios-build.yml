# Windows で開発していて有料の Apple Developer アカウントもないため、GitHub 上の Mac でビルドする。
# 署名なしの .ipa を成果物として出すので、Sideloadly で自分の Apple ID（無料）で署名して実機に入れる。
# Release ビルドなので JS も同梱され、PC の開発サーバーなしで走りに行ける。
# 非公開リポジトリの macOS ランナーは無料枠の消費が大きいため、手動実行のみ。
name: iOS build (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install JS dependencies
        run: npm ci
      - name: Generate native iOS project
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_IOS_API_KEY" ]; then
            echo "::error::シークレット GOOGLE_MAPS_IOS_API_KEY が未設定です"; exit 1
          fi
          npx expo prebuild --platform ios --clean
      - name: Check Google Maps setup (key itself is not printed)
        run: |
          PLIST=$(ls ios/*/Info.plist | grep -v Pods | head -1)
          KEY=$(/usr/libexec/PlistBuddy -c "Print :GMSApiKey" "$PLIST" 2>/dev/null || true)
          echo "Info.plist: $PLIST"
          echo "GMSApiKey length=${#KEY} startsWithAIza=$([[ "$KEY" == AIza* ]] && echo yes || echo no)"
          echo "--- AppDelegate"
          grep -n -E "GoogleMaps|provideAPIKey" ios/*/AppDelegate.swift | sed -E 's/provideAPIKey\("[^"]*"\)/provideAPIKey("***")/'
          echo "--- Podfile"
          grep -n "react-native-maps" ios/Podfile
          echo "--- Podfile.lock"
          grep -n -E "GoogleMaps|react-native-maps" ios/Podfile.lock | head
      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 \
            || { grep -nE "error:|fatal|BUILD FAILED" xcodebuild.log | head -50; tail -80 xcodebuild.log; exit 1; }
          tail -20 xcodebuild.log
      - name: Inspect built app for Google Maps (key itself is not printed)
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/$SCHEME.app"
          BIN="$APP/$SCHEME"
          echo "key literal in executable: $(grep -a -c -F "$GOOGLE_MAPS_IOS_API_KEY" "$BIN" || true)"
          echo "GMSServices symbols in executable: $(strings "$BIN" | grep -c GMSServices || true)"
          echo "--- bundles / frameworks"
          ls "$APP" | grep -iE "bundle|Frameworks" || true
          ls "$APP/Frameworks" 2>/dev/null | head -40 || true
          echo "--- GoogleMaps resources"
          find "$APP" -maxdepth 2 -iname "*GoogleMaps*" | head
          echo "--- canImport in build log"
          grep -n -iE "GoogleMaps" xcodebuild.log | grep -iE "warning|error|AppDelegate" | head -20 || true
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "ios/build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qr ride-log-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ride-log-unsigned-ipa
          path: ride-log-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
